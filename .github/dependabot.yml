version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # tailwindcss e @tailwindcss/* precisam da mesma versão: atualizar só o
      # plugin deixa duas versões do Tailwind no lock.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # @supabase/ssr declara peer dependency de uma versão mínima do
      # @supabase/supabase-js: sozinho, o PR quebra o npm ci (ERESOLVE).
      supabase:
        patterns:
          - "@supabase/*"
      # eslint-config-next acompanha a versão do next.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # @trpc/client, @trpc/server e @trpc/react-query exigem versão idêntica
      # entre si: sozinho, o PR quebra o npm ci (ERESOLVE).
      trpc:
        patterns:
          - "@trpc/*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
