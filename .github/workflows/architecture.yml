name: Architecture checks

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  foundation:
    name: Documentation and secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require architectural records
        shell: bash
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/PRD.md
          test -f docs/adr/001-stack.md
          test -f rules/restrictions.md
          test -f .env.example

      - name: Reject committed environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Environment files must not be versioned.' >&2
            exit 1
          fi

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Application quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # E2E com o servidor de desenvolvimento (`playwright.config.ts`), em runner limpo: com `CI`
  # definido, o Playwright sempre sobe o próprio `npm run dev` e nunca reutiliza outro servidor.
  # Sem retries e com os timeouts e o paralelismo da configuração versionada. O tRPC é simulado no
  # navegador; a chave pública é o mesmo valor fictício de `src/test/setup.ts`, sem credencial real.
  e2e:
    name: E2E (desenvolvimento)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-publica-de-teste-sem-credencial-real
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Instalar o Chromium do Playwright e as dependências do sistema
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: E2E (servidor de desenvolvimento)
        run: npm run test:e2e -- --reporter=line --retries=0
      - name: Guardar relatório e evidências da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desenvolvimento-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
